
<style>
  #app { padding: 1rem 0; font-family: var(--font-sans); }
  #drop-zone {
    border: 1.5px dashed var(--color-border-secondary);
    border-radius: var(--border-radius-lg);
    padding: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: background 0.15s;
    background: var(--color-background-secondary);
  }
  #drop-zone:hover, #drop-zone.drag-over { background: var(--color-background-info); border-color: var(--color-border-info); }
  #controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 1rem 0; }
  #controls select, #controls input { font-size: 13px; }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 1rem; }
  .stat-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; }
  .stat-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 2px; }
  .stat-value { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  #canvas-container { position: relative; border-radius: var(--border-radius-lg); overflow: hidden; border: 0.5px solid var(--color-border-tertiary); background: #0a0a12; }
  canvas#three-canvas { display: block; width: 100% !important; }
  #legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.75rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary); cursor: pointer; padding: 3px 8px; border-radius: 20px; border: 0.5px solid var(--color-border-tertiary); transition: opacity 0.15s; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  #tooltip { position: absolute; background: rgba(10,10,20,0.92); color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; pointer-events: none; display: none; max-width: 200px; line-height: 1.5; z-index: 10; }
  #progress-bar { display: none; margin: 1rem 0; }
  #progress-bar p { font-size: 13px; color: var(--color-text-secondary); margin-bottom: 6px; }
  progress { width: 100%; height: 6px; border-radius: 3px; }
  #error-msg { color: var(--color-text-danger); font-size: 13px; margin: 0.5rem 0; display: none; }
  #col-mapper { display: none; background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1rem 1.25rem; margin-bottom: 1rem; border: 0.5px solid var(--color-border-tertiary); }
  #col-mapper h3 { font-size: 14px; font-weight: 500; margin: 0 0 0.75rem; color: var(--color-text-primary); }
  .col-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; color: var(--color-text-secondary); }
  .col-row label { min-width: 90px; }
</style>

<div id="app">
  <h2 class="sr-only">영화 임베딩 3D 시각화 도구 — CSV를 업로드하여 1024차원 임베딩을 3D 공간에 시각화합니다.</h2>

  <div id="drop-zone" onclick="document.getElementById('csv-input').click()">
    <i class="ti ti-upload" style="font-size:28px; color: var(--color-text-secondary); display:block; margin-bottom:8px;" aria-hidden="true"></i>
    <p style="font-size:14px; font-weight:500; color:var(--color-text-primary); margin:0 0 4px;">CSV 파일을 드래그하거나 클릭하여 업로드</p>
    <p style="font-size:12px; color:var(--color-text-secondary); margin:0;">컬럼 예시: title, genre, embedding_0 ~ embedding_1023</p>
    <input type="file" id="csv-input" accept=".csv" style="display:none">
  </div>

  <div id="error-msg"></div>

  <div id="col-mapper">
    <h3>컬럼 매핑</h3>
    <div class="col-row"><label>제목 컬럼</label><select id="col-title"></select></div>
    <div class="col-row"><label>장르 컬럼</label><select id="col-genre"></select></div>
    <div class="col-row"><label>임베딩 prefix</label><input type="text" id="col-emb-prefix" value="embedding_" style="width:140px; font-size:13px;"> <span style="font-size:12px; color:var(--color-text-secondary);">또는 첫 번째 임베딩 컬럼명</span></div>
    <button id="btn-run" onclick="runVisualization()" style="margin-top:8px; font-size:13px; padding:6px 18px;">UMAP 실행 ↗</button>
  </div>

  <div id="progress-bar">
    <p id="progress-label">UMAP 계산 중...</p>
    <progress id="prog" value="0" max="100"></progress>
  </div>

  <div id="stats" style="display:none">
    <div class="stat-card"><div class="stat-label">영화 수</div><div class="stat-value" id="s-count">0</div></div>
    <div class="stat-card"><div class="stat-label">장르 수</div><div class="stat-value" id="s-genres">0</div></div>
    <div class="stat-card"><div class="stat-label">임베딩 차원</div><div class="stat-value" id="s-dim">-</div></div>
    <div class="stat-card"><div class="stat-label">UMAP 이웃 수</div><div class="stat-value" id="s-nn">15</div></div>
  </div>

  <div id="controls" style="display:none">
    <div style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--color-text-secondary);">
      <i class="ti ti-adjustments-horizontal" aria-hidden="true"></i>
      이웃 수 (n_neighbors)
      <input type="range" id="nn-slider" min="5" max="50" value="15" step="1" style="width:100px;" oninput="document.getElementById('nn-val').textContent=this.value; document.getElementById('s-nn').textContent=this.value;">
      <span id="nn-val" style="font-weight:500; min-width:20px;">15</span>
    </div>
    <div style="display:flex; align-items:center; gap:6px; font-size:13px; color:var(--color-text-secondary);">
      최소 거리
      <input type="range" id="md-slider" min="1" max="50" value="10" step="1" style="width:80px;" oninput="document.getElementById('md-val').textContent=(this.value/100).toFixed(2)">
      <span id="md-val" style="font-weight:500; min-width:32px;">0.10</span>
    </div>
    <button onclick="runVisualization()" style="font-size:12px; padding:5px 14px;">재실행 ↗</button>
    <button onclick="resetCamera()" style="font-size:12px; padding:5px 14px;"><i class="ti ti-refresh" aria-hidden="true"></i> 카메라 초기화</button>
  </div>

  <div id="canvas-container" style="display:none">
    <canvas id="three-canvas" height="480"></canvas>
    <div id="tooltip"></div>
  </div>

  <div id="legend"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const GENRE_COLORS = [
  '#7F77DD','#1D9E75','#D85A30','#D4537E','#378ADD',
  '#639922','#BA7517','#E24B4A','#888780','#5DCAA5',
  '#F0997B','#AFA9EC','#97C459','#EF9F27','#85B7EB'
];

let scene, camera, renderer, points, raycaster, mouse;
let allData = [], hiddenGenres = new Set();
let csvHeaders = [], csvRows = [];
let animId;

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 6000);
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = smartSplit(lines[i]);
    if (vals.length >= headers.length - 1) {
      const obj = {};
      headers.forEach((h, j) => obj[h] = (vals[j] || '').replace(/^"|"$/g, '').trim());
      rows.push(obj);
    }
  }
  return { headers, rows };
}

function smartSplit(line) {
  const res = []; let cur = ''; let inQ = false;
  for (let i = 0; i < line.length; i++) {
    if (line[i] === '"') { inQ = !inQ; }
    else if (line[i] === ',' && !inQ) { res.push(cur); cur = ''; }
    else { cur += line[i]; }
  }
  res.push(cur); return res;
}

function populateSelects(headers) {
  ['col-title','col-genre'].forEach(id => {
    const sel = document.getElementById(id);
    sel.innerHTML = headers.map(h => `<option value="${h}">${h}</option>`).join('');
  });
  const titleGuess = headers.find(h => /title|name|movie/i.test(h)) || headers[0];
  const genreGuess = headers.find(h => /genre|category|type/i.test(h)) || headers[1];
  document.getElementById('col-title').value = titleGuess;
  document.getElementById('col-genre').value = genreGuess;
  const embGuess = headers.find(h => /emb|vec|feat/i.test(h) && /[_\-]?0$/.test(h));
  if (embGuess) {
    const prefix = embGuess.replace(/0$/, '');
    document.getElementById('col-emb-prefix').value = prefix;
  }
}

document.getElementById('csv-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = parseCSV(ev.target.result);
      csvHeaders = parsed.headers; csvRows = parsed.rows;
      populateSelects(csvHeaders);
      document.getElementById('col-mapper').style.display = 'block';
      document.getElementById('drop-zone').style.display = 'none';
      document.getElementById('error-msg').style.display = 'none';
    } catch(err) { showError('CSV 파싱 오류: ' + err.message); }
  };
  reader.readAsText(file);
});

const dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0]; if (!file) return;
  document.getElementById('csv-input').files;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const parsed = parseCSV(ev.target.result);
      csvHeaders = parsed.headers; csvRows = parsed.rows;
      populateSelects(csvHeaders);
      document.getElementById('col-mapper').style.display = 'block';
      document.getElementById('drop-zone').style.display = 'none';
    } catch(err) { showError('CSV 파싱 오류: ' + err.message); }
  };
  reader.readAsText(file);
});

function runVisualization() {
  const titleCol = document.getElementById('col-title').value;
  const genreCol = document.getElementById('col-genre').value;
  const prefix = document.getElementById('col-emb-prefix').value.trim();
  const embCols = csvHeaders.filter(h => h.startsWith(prefix) && !isNaN(parseFloat(h.replace(prefix,''))));

  if (embCols.length < 3) {
    showError(`임베딩 컬럼을 찾을 수 없습니다. prefix "${prefix}"로 시작하는 컬럼이 ${embCols.length}개뿐입니다.`);
    return;
  }

  const embDim = embCols.length;
  document.getElementById('s-dim').textContent = embDim;

  const data = csvRows.filter(r => {
    const vec = embCols.map(c => parseFloat(r[c]));
    return vec.every(v => !isNaN(v));
  }).map(r => ({
    title: r[titleCol] || '(unknown)',
    genre: r[genreCol] || 'Unknown',
    vector: embCols.map(c => parseFloat(r[c]))
  }));

  if (data.length < 4) { showError(`유효한 데이터가 ${data.length}개뿐입니다. 최소 4개 이상 필요합니다.`); return; }

  document.getElementById('s-count').textContent = data.length;
  const genres = [...new Set(data.map(d => d.genre))];
  document.getElementById('s-genres').textContent = genres.length;
  document.getElementById('stats').style.display = 'grid';
  document.getElementById('controls').style.display = 'flex';

  const nn = parseInt(document.getElementById('nn-slider').value);
  const minDist = parseFloat(document.getElementById('md-slider').value) / 100;

  const pb = document.getElementById('progress-bar');
  pb.style.display = 'block';
  document.getElementById('progress-label').textContent = 'UMAP 계산 중 (대용량은 수초 소요)...';
  document.getElementById('prog').value = 10;

  setTimeout(() => {
    try {
      const coords3d = umap(data.map(d => d.vector), nn, minDist);
      document.getElementById('prog').value = 90;
      allData = data.map((d, i) => ({ ...d, x: coords3d[i][0], y: coords3d[i][1], z: coords3d[i][2] }));
      document.getElementById('prog').value = 100;
      pb.style.display = 'none';
      document.getElementById('col-mapper').style.display = 'none';
      renderScene(allData, genres);
    } catch(err) {
      pb.style.display = 'none';
      showError('UMAP 오류: ' + err.message);
      console.error(err);
    }
  }, 50);
}

function umap(vectors, nNeighbors, minDist) {
  const n = vectors.length;
  const dim = vectors[0].length;
  nNeighbors = Math.min(nNeighbors, n - 1);

  function dot(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += a[i]*b[i]; return s; }
  function norm(a) { return Math.sqrt(dot(a,a)); }
  function cosineDist(a, b) { const d = dot(a,b)/(norm(a)*norm(b)+1e-9); return 1 - d; }

  const knn = [];
  for (let i = 0; i < n; i++) {
    const dists = [];
    for (let j = 0; j < n; j++) {
      if (i !== j) dists.push({ j, d: cosineDist(vectors[i], vectors[j]) });
    }
    dists.sort((a,b) => a.d - b.d);
    knn.push(dists.slice(0, nNeighbors).map(x => x.j));
  }

  const rho = knn.map((nbrs, i) => cosineDist(vectors[i], vectors[nbrs[0]]));
  const sigma = knn.map((nbrs, i) => {
    let lo = 0, hi = 1000, target = Math.log2(nNeighbors);
    for (let iter = 0; iter < 30; iter++) {
      const mid = (lo + hi) / 2;
      let sum = 0;
      for (const j of nbrs) { const d = Math.max(0, cosineDist(vectors[i], vectors[j]) - rho[i]); sum += Math.exp(-d/mid); }
      if (sum > target) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  });

  const graph = Array.from({length: n}, () => new Array(n).fill(0));
  for (let i = 0; i < n; i++) {
    for (const j of knn[i]) {
      const d = Math.max(0, cosineDist(vectors[i], vectors[j]) - rho[i]);
      const w = Math.exp(-d / (sigma[i] + 1e-9));
      graph[i][j] = Math.max(graph[i][j], w);
      graph[j][i] = Math.max(graph[j][i], w);
    }
  }

  const coords = Array.from({length: n}, () => [
    (Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10
  ]);

  const a = 1 / (2 * minDist + 1e-9);
  const b = minDist;
  const lr = 1.0;
  const epochs = Math.min(200, Math.max(50, Math.floor(5000 / n)));

  for (let ep = 0; ep < epochs; ep++) {
    const currLr = lr * (1 - ep / epochs);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (i === j) continue;
        const w = graph[i][j];
        const dx = coords[i][0]-coords[j][0], dy = coords[i][1]-coords[j][1], dz = coords[i][2]-coords[j][2];
        const dist2 = dx*dx + dy*dy + dz*dz + 1e-9;
        const dist = Math.sqrt(dist2);
        if (w > 0.01) {
          const grad = -2*a*b*Math.pow(dist2, b-1) / (a*Math.pow(dist2, b)+1) * w;
          coords[i][0] -= currLr * grad * dx / dist;
          coords[i][1] -= currLr * grad * dy / dist;
          coords[i][2] -= currLr * grad * dz / dist;
        }
        if (Math.random() < 0.02) {
          const repulse = 2 / (dist2 * (1 - a*Math.pow(dist2, b) + 1e-9) + 1e-9);
          const clamp = Math.min(repulse, 4);
          coords[i][0] += currLr * clamp * dx / (dist + 1e-9);
          coords[i][1] += currLr * clamp * dy / (dist + 1e-9);
          coords[i][2] += currLr * clamp * dz / (dist + 1e-9);
        }
      }
    }
  }
  return coords;
}

function renderScene(data, genres) {
  const container = document.getElementById('canvas-container');
  container.style.display = 'block';

  if (renderer) { renderer.dispose(); cancelAnimationFrame(animId); }

  const genreColorMap = {};
  genres.forEach((g, i) => genreColorMap[g] = GENRE_COLORS[i % GENRE_COLORS.length]);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(60, container.clientWidth / 480, 0.1, 1000);
  camera.position.set(0, 0, 25);

  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, 480);
  renderer.setClearColor(0x0a0a12, 1);

  const geom = new THREE.BufferGeometry();
  const positions = new Float32Array(data.length * 3);
  const colors = new Float32Array(data.length * 3);

  data.forEach((d, i) => {
    positions[i*3] = d.x; positions[i*3+1] = d.y; positions[i*3+2] = d.z;
    const c = new THREE.Color(genreColorMap[d.genre] || '#888');
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  });

  geom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({ size: 0.35, vertexColors: true, sizeAttenuation: true, transparent: true, opacity: 0.88 });
  points = new THREE.Points(geom, mat);
  scene.add(points);

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));

  raycaster = new THREE.Raycaster(); raycaster.params.Points.threshold = 0.4;
  mouse = new THREE.Vector2();

  let isDragging = false, prevMouse = {x: 0, y: 0};
  let rotX = 0, rotY = 0, zoom = 25;

  const cv = renderer.domElement;
  cv.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x: e.clientX, y: e.clientY}; });
  cv.addEventListener('mouseup', () => isDragging = false);
  cv.addEventListener('mousemove', e => {
    const rect = cv.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    if (isDragging) {
      rotY += (e.clientX - prevMouse.x) * 0.4;
      rotX += (e.clientY - prevMouse.y) * 0.4;
      prevMouse = {x: e.clientX, y: e.clientY};
    }
    showTooltip(e, rect);
  });
  cv.addEventListener('wheel', e => { zoom = Math.max(5, Math.min(80, zoom + e.deltaY * 0.03)); });
  cv.addEventListener('mouseleave', () => { document.getElementById('tooltip').style.display = 'none'; });

  function showTooltip(e, rect) {
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(points);
    const tip = document.getElementById('tooltip');
    const vis = data.filter(d => !hiddenGenres.has(d.genre));
    if (intersects.length > 0) {
      const idx = intersects[0].index;
      const d = data[idx];
      if (!hiddenGenres.has(d.genre)) {
        tip.style.display = 'block';
        tip.style.left = (e.clientX - rect.left + 12) + 'px';
        tip.style.top = (e.clientY - rect.top - 20) + 'px';
        tip.innerHTML = `<strong style="color:#fff">${d.title}</strong><br><span style="color:#aaa">${d.genre}</span>`;
      } else { tip.style.display = 'none'; }
    } else { tip.style.display = 'none'; }
  }

  window._resetCamera = function() { rotX = 0; rotY = 0; zoom = 25; };

  function animate() {
    animId = requestAnimationFrame(animate);
    points.rotation.x = rotX * Math.PI / 180;
    points.rotation.y = rotY * Math.PI / 180;
    camera.position.z = zoom;
    renderer.render(scene, camera);
  }
  animate();

  buildLegend(genres, genreColorMap, data);
}

function buildLegend(genres, colorMap, data) {
  const leg = document.getElementById('legend');
  leg.innerHTML = '';
  genres.forEach(g => {
    const div = document.createElement('div');
    div.className = 'legend-item';
    div.innerHTML = `<span class="legend-dot" style="background:${colorMap[g]}"></span>${g}`;
    div.title = `${data.filter(d => d.genre === g).length}개`;
    div.onclick = () => toggleGenre(g, div, colorMap);
    leg.appendChild(div);
  });
}

function toggleGenre(genre, el, colorMap) {
  if (hiddenGenres.has(genre)) {
    hiddenGenres.delete(genre);
    el.style.opacity = '1';
  } else {
    hiddenGenres.add(genre);
    el.style.opacity = '0.35';
  }
  if (!points) return;
  const geom = points.geometry;
  const colors = geom.attributes.color;
  allData.forEach((d, i) => {
    const c = hiddenGenres.has(d.genre) ? new THREE.Color(0x1a1a2a) : new THREE.Color(colorMap[d.genre] || '#888');
    colors.setXYZ(i, c.r, c.g, c.b);
  });
  colors.needsUpdate = true;
}

function resetCamera() { if (window._resetCamera) window._resetCamera(); }
</script>
