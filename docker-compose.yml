# Movie Recommend System — 로컬 개발용 Docker Compose
#
# README §3 Quick Start / §8 서비스 실행 기준 구성:
#   - Neo4j 5 (APOC, 벡터/풀텍스트 인덱스)
#   - PostgreSQL (chat / outbox / bandit / eval / LangGraph checkpoint)
#   - FastAPI API + Outbox ingest worker
#   - (선택) vLLM generation + embedding — NVIDIA GPU 필요
#
# 사용법
# ------
#   cp docker-compose.env.example docker-compose.env
#
#   # 1) 인프라만 (Neo4j + Postgres)
#   docker compose up -d neo4j postgres
#
#   # 2) 스키마 초기화 (1회)
#   docker compose run --rm bootstrap
#   python -m scripts.bootstrap_schema
#
#   # 3) API + ingest worker (vLLM 없이도 기동 가능 — LLM 호출은 실패할 수 있음)
#   docker compose --profile app up -d api ingest-worker
#   python -m uvicorn src.api.app:app --host 0.0.0.0 --port 8080
#   python -m scripts.run_ingest_worker --concurrency 10
#
#   # 4) GPU + vLLM 포함 전체 스택
#   docker compose --profile app --profile gpu up -d
#
# 엔드포인트
# ----------
#   Neo4j Browser : http://localhost:7474  (neo4j / neo4j)
#   FastAPI       : http://localhost:8080/docs
#   vLLM Gen      : http://localhost:8000/v1  (profile: gpu)
#   vLLM Embed    : http://localhost:8001/v1  (profile: gpu)

name: movie-recommend-system

services:
  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------
  neo4j:
    image: neo4j:latest
    container_name: mrs-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_PLUGINS: '["apoc-extended"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - ~/Desktop/dvc/chatbot/neo4j/data:/data
      - ~/Desktop/dvc/chatbot/neo4j/conf:/var/lib/neo4j/conf
      - ~/Desktop/dvc/chatbot/neo4j/plugins:/var/lib/neo4j/plugins
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  postgres:
    image: postgres:latest
    container_name: mrs-postgres
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DATABASE:-chatbot}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
    volumes:
      - ~/Desktop/dvc/chatbot/movie_crawler/movie_postgresql_server:/var/lib/postgresql/18/docker
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-postgres} -d ${PG_DATABASE:-chatbot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  # ---------------------------------------------------------------------------
  # One-shot schema bootstrap (Neo4j + Postgres + LangGraph checkpoint)
  # ---------------------------------------------------------------------------
  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrs-bootstrap
    profiles: [app]
    env_file:
      - docker-compose.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PG_HOST: postgres
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["python", "scripts/bootstrap_schema.py"]
    restart: "no"

  # ---------------------------------------------------------------------------
  # Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrs-api
    profiles: [app]
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - docker-compose.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PG_HOST: postgres
      VLLM_GEN__BASE_URL: http://vllm-gen:8000/v1
      VLLM_EMBED__BASE_URL: http://vllm-embed:8001/v1
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "src.api.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  ingest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrs-ingest-worker
    profiles: [app]
    restart: unless-stopped
    env_file:
      - docker-compose.env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      PG_HOST: postgres
      VLLM_GEN__BASE_URL: http://210.109.52.56/vllm/v1
      VLLM_EMBED__BASE_URL: http://210.109.52.56/vllm-embed/v1
    depends_on:
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    command: ["python", "scripts/run_ingest_worker.py", "--concurrency", "4"]

