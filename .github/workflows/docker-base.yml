name: Docker Base Image

on:
  push:
    branches:
      - main
      - dev/api
      - dev/bootstrap
      - dev/ingest
    paths:
      - requirements.txt
      - pyproject.toml
      - docker-image/base.Dockerfile
  workflow_call:
    outputs:
      base_image:
        description: Full base image reference
        value: ${{ jobs.build-base.outputs.base_image }}
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      base_image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute requirements hash
        id: req_hash
        run: echo "hash=$(sha256sum requirements.txt | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.req_hash.outputs.hash }}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-image/base.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:cache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/base:cache,mode=max
