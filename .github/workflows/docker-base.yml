name: Docker Base Image

on:
  push:
    branches:
      - main
      - dev/api
      - dev/bootstrap
      - dev/ingest
    paths:
      - requirements.txt
      - pyproject.toml
      - docker-image/base.Dockerfile
  workflow_call:
    outputs:
      base_image:
        description: Full base image reference
        value: ${{ jobs.build-base.outputs.base_image }}
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.base.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute requirements hash
        id: req_hash
        run: echo "hash=$(sha256sum requirements.txt | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve image reference
        id: base
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          echo "image=${DOCKER_USERNAME}/movie-recommend-system-base:${{ steps.req_hash.outputs.hash }}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-base
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.req_hash.outputs.hash }}
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-image/base.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-base:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-base:cache,mode=max
