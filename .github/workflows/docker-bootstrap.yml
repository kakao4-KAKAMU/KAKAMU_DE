name: Docker Bootstrap Image

on:
  push:
    branches:
      - dev/bootstrap
  workflow_dispatch:

env:
  SERVICE: bootstrap

jobs:
  ensure-base:
    uses: ./.github/workflows/docker-base.yml
    secrets: inherit

  build-bootstrap:
    needs: ensure-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Resolve base image tag
        id: base
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          HASH=$(sha256sum requirements.txt | cut -c1-12)
          echo "image=${DOCKER_USERNAME}/movie-recommend-system-base:${HASH}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-${{ env.SERVICE }}
          tags: |
            type=raw,value=1.${{ github.run_number }}
            type=raw,value=latest
            type=sha,prefix=

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker-image/bootstrap.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.image }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-base:cache
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-${{ env.SERVICE }}:cache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/movie-recommend-system-${{ env.SERVICE }}:cache,mode=max

      - name: Checkout Helm Chart Repo
        uses: actions/checkout@v4
        with:
          repository: kakao4-KAKAMU/kakamu_helm
          token: ${{ secrets.HELM_REPO_TOKEN }}
          path: helm-charts
          ref: main

      - name: Update Helm Values
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          cd helm-charts/environments/dev/movie
          yq -i '(.containers[] | select(.name == "${{ env.SERVICE }}") | .image.tag) = "1.${{ github.run_number }}"' values.yaml

          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git add values.yaml

          if ! git diff --cached --quiet; then
            git commit -m "update ${{ env.SERVICE }} image tag to 1.${{ github.run_number }}"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
