[project]
name = "movie-recommend-system"
version = "0.2.0"
description = "Knowledge-graph based movie/feed recommendation system (Neo4j + LangGraph + LangChain + FastAPI)"
requires-python = ">=3.11"
dependencies = [
    # --- Core runtime ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",

    # --- LLM stack (vLLM via OpenAI-compatible API) ---
    "openai>=2.44.0",
    "langgraph>=1.2.6",
    "langchain-neo4j>=0.10.0",
    "langchain-openai>=1.3.3",
    "langgraph-checkpoint-postgres>=2.0.0",
    "CyVer>=2.0.2",

    # --- Storage ---
    "neo4j>=5.24.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",

    # --- Resilience / observability ---
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires live Neo4j/PostgreSQL/vLLM (skipped by default)",
]
